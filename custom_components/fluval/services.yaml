set_simple_schedule:
  target:
    entity:
      integration: fluval
      domain: light
  fields:
    on_at:
      required: true
      example: "07:00"
      selector:
        time:
    off_at:
      required: true
      example: "21:00"
      selector:
        time:
    color:
      required: true
      example: "[255, 255, 182]"
      selector:
        color_rgb:
    white:
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    brightness:
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    ramp_minutes:
      default: 30
      selector:
        number:
          min: 0
          max: 720
          unit_of_measurement: min

set_pro_schedule:
  target:
    entity:
      integration: fluval
      domain: light
  fields:
    points:
      required: true
      selector:
        object:
          multiple: true
          label_field: time
          fields:
            time:
              required: true
              selector:
                time:
            color:
              required: true
              selector:
                color_rgb:
            white:
              selector:
                number:
                  min: 0
                  max: 100
                  unit_of_measurement: "%"
            brightness:
              selector:
                number:
                  min: 0
                  max: 100
                  unit_of_measurement: "%"
      example: |
        - time: "05:30"
          color: [0, 0, 255]
          brightness: 0
        - time: "07:30"
          color: [255, 255, 182]
          white: 100
          brightness: 80
        - time: "21:30"
          levels: "0, 0, 0, 0"

preview:
  target:
    entity:
      integration: fluval
      domain: light
  fields:
    seconds:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
